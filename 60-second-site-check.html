<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>60-Second Site Check | Window & Door Job Checklist | Permit Toolkit</title>
<meta name="description" content="Free 60-second site checklist for South Florida window and door contractors. Flag missing measurements, photos, HOA documents, engineering, electrical, and patio egress issues before permit prep.">
<meta property="og:title" content="60-Second Site Check — Permit Toolkit">
<meta property="og:description" content="Tap through a 60-second window, door, and patio site check. Get production flags and a one-page PDF.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://permittoolkit.com/60-second-site-check.html">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/styles.css">
<style>
  body.sc-page{background:#fff;}
  .sc-page .wrap{max-width:560px;padding-bottom:48px;}
  .sc-page h1.page-title{font-size:clamp(22px,4vw,28px);margin:0 0 4px;}
  .sc-page .page-sub{font-size:14px;color:var(--muted);margin-bottom:18px;}
  .sc-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .sc-back{
    min-height:44px;padding:8px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--ink);
  }
  .sc-back:hover{background:var(--surface-2);}
  .sc-back:disabled{opacity:.35;}
  .sc-progress{font-size:13px;font-weight:600;color:var(--faint);}
  .sc-q{font-size:clamp(22px,4.5vw,28px);letter-spacing:-0.02em;margin:0 0 12px;line-height:1.2;}
  .sc-hint{font-size:13.5px;color:var(--muted);margin:0 0 14px;line-height:1.45;}
  .sc-choices{display:flex;flex-direction:column;gap:10px;}
  .sc-choice{
    display:block;width:100%;min-height:56px;text-align:left;
    padding:16px 18px;border:1px solid var(--border);border-radius:12px;
    background:#fff;font-size:16px;font-weight:600;letter-spacing:-0.01em;
    transition:border-color .12s, background .12s, transform .08s;
  }
  .sc-choice:hover{border-color:var(--primary);}
  .sc-choice:focus-visible{outline:3px solid var(--primary);outline-offset:2px;}
  .sc-choice.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-hover);}
  .sc-checks{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .sc-check{
    display:flex;align-items:center;gap:10px;min-height:48px;
    padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-weight:600;font-size:15px;
  }
  .sc-check input{width:18px;height:18px;}
  .sc-continue{margin-top:4px;min-height:52px;justify-content:center;width:100%;}
  .sc-status{border-radius:14px;padding:20px 18px;margin-bottom:16px;border:1px solid;}
  .sc-status.ok{background:var(--success-soft);border-color:#86efac;color:#14532d;}
  .sc-status.warn{background:var(--warn-soft);border-color:#fcd34d;color:#92400e;}
  .sc-status.hold{background:var(--danger-soft);border-color:#fca5a5;color:#991b1b;}
  .sc-status-kicker{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
  .sc-status-label{font-size:20px;font-weight:700;letter-spacing:-0.02em;display:flex;gap:8px;align-items:flex-start;line-height:1.25;}
  .sc-ico{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:999px;flex-shrink:0;font-size:14px;font-weight:800;
    background:currentColor;color:#fff;margin-top:2px;
  }
  .sc-status.ok .sc-ico{background:#16a34a;color:#fff;}
  .sc-status.warn .sc-ico{background:#d97706;color:#fff;}
  .sc-status.hold .sc-ico{background:#dc2626;color:#fff;}
  .sc-status-meta{margin:8px 0 0;font-size:13px;opacity:.85;}
  .sc-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff;}
  .sc-card h2{font-size:14px;margin:0 0 10px;letter-spacing:-0.01em;}
  .sc-card dl{display:flex;flex-direction:column;gap:8px;}
  .sc-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;}
  .sc-row dt{color:var(--muted);}
  .sc-row dd{font-weight:600;text-align:right;}
  .sc-row dd[data-v="Missing"],
  .sc-row dd[data-v="Follow-up needed"],
  .sc-row dd[data-v="Review required"],
  .sc-row dd[data-v="Electrician review needed"],
  .sc-row dd[data-v="Potential issue"],
  .sc-row dd[data-v="Review needed"]{color:var(--danger);}
  .sc-row dd[data-v="Verify"],
  .sc-row dd[data-v="Captured — not a code clearance"]{color:var(--warn);}
  .sc-row dd[data-v="Complete"],
  .sc-row dd[data-v="Received"],
  .sc-row dd[data-v="None"],
  .sc-row dd[data-v="Clear"],
  .sc-row dd[data-v="Not flagged"],
  .sc-row dd[data-v="Confirmed"]{color:var(--success);}
  .sc-actions{margin:0;padding-left:18px;}
  .sc-actions li{margin:0 0 8px;font-size:14.5px;line-height:1.4;}
  .sc-links{display:flex;flex-direction:column;gap:8px;}
  .sc-links a{font-weight:600;color:var(--primary);font-size:14px;}
  .sc-card label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .sc-card textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;
    font:inherit;font-size:14px;resize:vertical;min-height:64px;
  }
  .sc-actions-bar{display:flex;flex-direction:column;gap:8px;margin:16px 0;}
  .sc-actions-bar .btn-primary,
  .sc-actions-bar .btn-secondary{justify-content:center;min-height:52px;width:100%;}
  .sc-cta{
    background:#0f172a;color:#fff;border-radius:14px;padding:22px 18px;margin:8px 0 12px;
  }
  .sc-cta h2{font-size:18px;margin:0 0 8px;color:#fff;}
  .sc-cta p{font-size:14px;color:#cbd5e1;margin:0 0 12px;line-height:1.5;}
  .sc-cta .sc-hint{color:#94a3b8;}
  .sc-cta .btn-primary{background:#2563eb;}
  .sc-email-form{display:flex;gap:8px;margin-top:10px;}
  .sc-email-form input{flex:1;min-height:48px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font:inherit;}
  .sc-email-form button{
    min-height:48px;padding:0 16px;border-radius:8px;background:var(--ink);color:#fff;font-weight:600;
  }
  .sc-email .ok{margin-top:8px;color:var(--success);font-weight:600;font-size:13px;}
  #scPrint{display:none;}
  @media print{
    .site-header,.aio-bar,.aio-promo,.site-footer,.legend,.wrap,.sc-actions-bar,.sc-email,.sc-cta a{display:none !important;}
    body.sc-page{background:#fff;color:#000;}
    #scPrint{display:block !important;padding:18px 22px;font-size:11.5px;color:#111;max-width:none;}
    #scPrint h1{font-size:18px;margin:0 0 2px;color:#000;}
    #scPrint h2{font-size:12px;margin:0 0 8px;font-weight:600;color:#333;}
    #scPrint h3{font-size:12px;margin:12px 0 4px;color:#000;}
    #scPrint .meta{margin:0 0 10px;color:#444;}
    #scPrint table{width:100%;border-collapse:collapse;margin-bottom:6px;}
    #scPrint th{text-align:left;width:42%;font-weight:600;padding:3px 8px 3px 0;color:#333;}
    #scPrint td{padding:3px 0;}
    #scPrint ol{margin:0;padding-left:18px;}
    #scPrint .cta{margin-top:12px;padding-top:8px;border-top:1px solid #ccc;}
    #scPrint .disc{font-size:9.5px;color:#444;margin-top:10px;line-height:1.4;}
  }
</style>
</head>

</div>

</html>
